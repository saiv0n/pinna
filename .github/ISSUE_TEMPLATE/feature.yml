name: Feature request
description: Something Pinna could do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What it should do and why it would help you.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where you've seen it
      description: If an iPhone, Mac or another project already does this, say where.
