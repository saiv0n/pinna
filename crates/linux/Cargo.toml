[package]
name = "pinna-linux"
description = "Linux servisi (BlueZ) ve komut satırı aracı"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pinna_linux"

[dependencies]
pinna-core = { path = "../core" }
anyhow = "1.0.105"
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap"] }
clap = { version = "4.6.9", features = ["derive"] }
env_logger = "0.11.12"
dirs = "7.0.0"
futures = "0.3.34"
log = "0.4.35"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
